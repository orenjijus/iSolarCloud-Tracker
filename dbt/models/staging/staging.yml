version: 2

models:
  - name: stg_isolarcloud__perf_unpivoted
    description: "Unpivoted performance data from iSolarCloud historical_data"
    tags: [daily_staging]
    columns:
      - name: timestamp
        description: "Measurement timestamp"
      - name: device_ps_key
        description: "Foreign key to iSolarCloud devices"
      - name: metric_id
        description: "Measurement point ID (e.g., p96, p97)"
      - name: metric_value
        description: "Value of the measurement"
        
  - name: stg_fusionsolar__perf_unpivoted
    description: "Unpivoted performance data from FusionSolar historical_data"
    tags: [daily_staging]
    columns:
      - name: collect_time
        description: "Measurement timestamp"
      - name: dev_id
        description: "Foreign key to FusionSolar devices"
      - name: metric_id
        description: "Measurement point ID"
      - name: metric_value
        description: "Value of the measurement"

  - name: stg_isolarcloud__sites
    description: "iSolarCloud power stations (sites)"
    columns:
      - name: ps_id
        description: "Primary key"
      - name: ps_name
        description: "Power station name"

  - name: stg_isolarcloud__devices
    description: "iSolarCloud devices"
    columns:
      - name: device_ps_key
        description: "Primary key"
      - name: ps_id
        description: "Foreign key to sites"
      - name: device_type
        description: "Device type (1=Inverter, etc.)"
      - name: device_name
        description: "Device name"

  - name: stg_fusionsolar__sites
    description: "FusionSolar plants (sites)"
    columns:
      - name: plant_code
        description: "Primary key"
      - name: plant_name
        description: "Plant name"

  - name: stg_fusionsolar__devices
    description: "FusionSolar devices"
    columns:
      - name: dev_id
        description: "Primary key"
      - name: plant_code
        description: "Foreign key to sites"
      - name: dev_type_id
        description: "Device type ID"
      - name: dev_name
        description: "Device name"

