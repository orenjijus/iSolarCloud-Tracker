        description: "Meter configuration and metadata"
      - name: seed_daily_simulation_target
        description: "Daily simulation targets for site performance comparison"
      - name: seed_monthly_simulation_target
        description: "Monthly simulation targets for site performance comparison"
      - name: seed_yearly_simulation_target
        description: "Yearly simulation targets for site performance comparison"

