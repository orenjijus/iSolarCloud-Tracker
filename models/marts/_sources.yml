version: 2

sources:
  - name: seed
    description: "Seed files containing configuration data"
    tables:
      - name: seed_metric_mapper
        description: "Mapping of measurement point IDs to metric names"
      - name: seed_sensor_config
        description: "Sensor configuration and metadata"
