name: 'mmsr_solar_data'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'mmsr_solar'

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

models:
  mmsr_solar_data:
    # Config indicated by + and applies to all files under models/example/
    staging:
      +materialized: view
    
    intermediate:
      +materialized: table  # Changed from view to table for better performance with aggregations
    
    marts:
      +materialized: table
      +tags: ["marts"]
    
    dimensions:
      +materialized: table

seeds:
  mmsr_solar_data:
    +quote_columns: false  # Prevent quoting of column names in CSV
    seed_metric_mapper:
      +quote_columns: false
    seed_sensor_config:
      +quote_columns: false
    seed_meter_config:
      +quote_columns: false
    seed_daily_simulation_target:
      +quote_columns: true
      +delimiter: ";"
    seed_monthly_simulation_target:
      +quote_columns: false
      +enabled: false  # Skip - formatting issues
    seed_yearly_simulation_target:
      +quote_columns: false
      +enabled: false  # Skip - formatting issues

vars:
  project_name: mmsr_solar_data

